name: Production DB setup

on:
  workflow_dispatch:

jobs:
  migrate-and-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Migrate, verify, and seed Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:setup:prod
